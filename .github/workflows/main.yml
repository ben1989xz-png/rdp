name: AZURE RDP WITH IDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          # Optionally disable Network Level Auth (NLA) if necessary; leave enabled for better security
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          # Ensure firewall rule exists (replace or recreate)
          netsh advfirewall firewall delete rule name="RDP-Tailscale" > $null 2>&1
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Grant Permissions to D Drive
        shell: pwsh
        run: |
          # Даем полный доступ к корню диска D: всем пользователям
          icacls "D:\" /grant "Users:(OI)(CI)(F)"
          icacls "D:\" /grant "Administrators:(OI)(CI)(F)"
          icacls "D:\" /grant "Authenticated Users:(OI)(CI)(F)"

          # Создаем удобную папку для загрузок
          New-Item -ItemType Directory -Path "D:\Downloads" -Force | Out-Null
          icacls "D:\Downloads" /grant "Users:(OI)(CI)(F)"

          Write-Host "Права на диск D: успешно обновлены."

      - name: Install WinFsp from GitHub
        shell: pwsh
        run: |
          Write-Host "Скачиваем WinFsp напрямую с GitHub..."
          $url = "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\winfsp.msi"
          
          Write-Host "Устанавливаем в тихом режиме..."
          Start-Process msiexec.exe -ArgumentList "/i", "`"$env:TEMP\winfsp.msi`"", "/qn", "/norestart" -Wait
          
          Remove-Item "$env:TEMP\winfsp.msi"
          Write-Host "✅ WinFsp успешно установлен."

      - name: Download and Setup rclone
        shell: pwsh
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          Write-Host "Скачиваем rclone с официального сайта..."
          Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "$env:TEMP\rclone.zip"

          Write-Host "Распаковываем..."
          Expand-Archive -Path "$env:TEMP\rclone.zip" -DestinationPath "$env:TEMP\rclone_ext" -Force

          Write-Host "Копируем rclone.exe в C:\rclone..."
          $rcloneDir = Get-ChildItem -Path "$env:TEMP\rclone_ext" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Path "C:\rclone" -Force | Out-Null
          Copy-Item -Path (Join-Path $rcloneDir.FullName "rclone.exe") -Destination "C:\rclone\rclone.exe"

          Write-Host "Создаем конфигурационный файл из секретов GitHub..."
          $env:RCLONE_CONFIG_DATA | Out-File -FilePath "C:\rclone\rclone.conf" -Encoding utf8

          Write-Host "✅ rclone успешно скачан и настроен."

      - name: Check MSYS2 presence
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\msys64\usr\bin\bash.exe")) {
            Write-Error "MSYS2 не найден в C:\msys64\"
            exit 1
          }
          Write-Host "MSYS2 найден: C:\msys64\usr\bin\bash.exe"

      - name: Pacman first pass
        shell: pwsh
        run: |
          $bash = "C:\msys64\usr\bin\bash.exe"
          & $bash -lc "pacman -Syu --noconfirm"
          exit 0

      - name: Pacman second pass (fresh process = restart)
        shell: pwsh
        run: |
          $bash = "C:\msys64\usr\bin\bash.exe"
          & $bash -lc "pacman -Syu --noconfirm"
          Write-Host "Второй проход pacman завершён."

      - name: Install all packages
        shell: pwsh
        run: |
          $bash = "C:\msys64\usr\bin\bash.exe"
          & $bash -lc "pacman -Syu --noconfirm"
          
      - name: Install FFmpeg dependencies
        shell: pwsh
        run: |
          $bash = "C:\msys64\usr\bin\bash.exe"
          $packages = "mingw-w64-x86_64-gcc mingw-w64-x86_64-make mingw-w64-x86_64-pkg-config mingw-w64-x86_64-nasm mingw-w64-x86_64-x264 mingw-w64-x86_64-x265 mingw-w64-x86_64-libvpx mingw-w64-x86_64-lame mingw-w64-x86_64-opus make diffutils git zip curl"

          Write-Host "=== Установка пакетов ==="
          & $bash -lc "pacman -S --needed --noconfirm --overwrite '*' --disable-download-timeout $packages"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== Первая попытка упала. Пробуем с -Syuu ==="
            & $bash -lc "pacman -Syuu --noconfirm --overwrite '*' --disable-download-timeout $packages"
          }

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Установка пакетов провалилась дважды"
            exit 1
          }
          Write-Host "Все пакеты установлены."

      - name: Clone FFmpeg and apply Bink 2 patch
        shell: pwsh
        run: |
          $bash = "C:\msys64\usr\bin\bash.exe"
          & $bash -lc "mkdir -p /c/ffmpeg-build && cd /c/ffmpeg-build && git clone --depth 1 --branch n7.1.2 https://git.ffmpeg.org/ffmpeg.git && cd ffmpeg && curl -L -o bink2.patch https://github.com/sharpemu/ffmpeg-core/raw/master/bink2.patch && git apply bink2.patch && ls libavcodec/ | grep -i bink"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Клонирование или патч не удался"
            exit 1
          }
          Write-Host "FFmpeg склонирован и пропатчен."

      - name: Configure FFmpeg (static build)
        shell: pwsh
        run: |
          $bash = "C:\msys64\usr\bin\bash.exe"
          $env:MSYSTEM = "MINGW64"
          $env:CHERE_INVOKING = "1"
          $cmd = 'cd /c/ffmpeg-build/ffmpeg && ./configure --prefix=/c/ffmpeg-bink2 --pkg-config-flags="--static" --extra-ldexeflags="-static" --enable-gpl --enable-libx264 --enable-libx265 --enable-libvpx --enable-libmp3lame --enable-libopus --enable-static --disable-shared --disable-doc --disable-debug'
          & $bash -lc $cmd
          & $bash -lc "which gcc && gcc --version | head -1"
          if ($LASTEXITCODE -ne 0) { Write-Error "configure провалился"; exit 1 }
          Write-Host "Configure завершён."

      - name: Build FFmpeg
        shell: pwsh
        run: |
          $bash = "C:\msys64\usr\bin\bash.exe"
          $env:MSYSTEM = "MINGW64"
          & $bash -lc "cd /c/ffmpeg-build/ffmpeg && make -j4"
          if ($LASTEXITCODE -ne 0) { Write-Error "make провалился"; exit 1 }
          Write-Host "Сборка завершена."

      - name: Install FFmpeg
        shell: pwsh
        run: |
          $bash = "C:\msys64\usr\bin\bash.exe"
          $env:MSYSTEM = "MINGW64"
          & $bash -lc "cd /c/ffmpeg-build/ffmpeg && make install"
          Write-Host "FFmpeg установлен в C:\ffmpeg-bink2"

      - name: Verify Bink 2 support
        shell: pwsh
        run: |
          $ffmpeg = "C:\ffmpeg-bink2\bin\ffmpeg.exe"
          if (-not (Test-Path $ffmpeg)) {
            Write-Error "ffmpeg.exe не найден в C:\ffmpeg-bink2\bin\"
            exit 1
          }
          Write-Host "=== Bink codecs ==="
          & $ffmpeg -codecs 2>&1 | Select-String "bink"
          Write-Host "=== Version ==="
          & $ffmpeg -version | Select-Object -First 1

      - name: Create or Update Static RDP User (robust)
        shell: pwsh
        env:
          # these are read from GitHub Secrets; set them in the repo or organization secrets
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          # Read from environment (populated from secrets)
          $username = $env:RDP_USERNAME
          $password = $env:RDP_PASSWORD

          # Defensive checks
          if (-not $username -or $username.Trim().Length -eq 0) {
            Write-Error "RDP_USERNAME is empty or not provided. Set the secret 'RDP_USERNAME'."
            exit 1
          }
          if (-not $password -or $password.Trim().Length -eq 0) {
            Write-Error "RDP_PASSWORD is empty or not provided. Set the secret 'RDP_PASSWORD'."
            exit 1
          }

          # Detect accidental masking / misuse: literal '***' should not be used
          if ($username -eq '***' -or $password -eq '***') {
            Write-Error "Detected literal '***' for username or password. Do NOT hardcode or assign '***' — use real values or GitHub Secrets."
            exit 1
          }

          # Optional: enforce minimum password complexity/length
          if ($password.Length -lt 8) {
            Write-Warning "Password length is less than 8 characters. Windows may reject weak passwords."
            # optionally fail: uncomment next two lines to enforce
            # Write-Error "Password must be at least 8 characters long."
            # exit 1
          }

          # Convert to SecureString
          try {
            $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          } catch {
            Write-Error "Failed to convert password to SecureString: $_"
            exit 1
          }

          # Create or update the local user
          try {
            $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
            if (-not $existing) {
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires -UserMayNotChangePassword:$false
              Write-Host "Created local user: $username"
            } else {
              Set-LocalUser -Name $username -Password $securePass
              Write-Host "Updated password for existing user: $username"
            }
          } catch {
            Write-Error "Failed to create or update user: $_"
            exit 1
          }

          # Ensure group membership (Remote Desktop Users required; admin is optional)
          try {
            if (-not (Get-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue)) {
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
            }
            # Add to Administrators if you want admin privileges (comment out if not desired)
            if (-not (Get-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue)) {
              Add-LocalGroupMember -Group "Administrators" -Member $username
            }
          } catch {
            Write-Warning "Failed to adjust group membership: $_"
          }

          # Export username and (optionally) password to the job environment
          # Password printed later — if from a GitHub Secret it will usually be masked in logs
          echo "RDP_USERNAME=$username" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TAILSCALE_AUTH_KEY -or $env:TAILSCALE_AUTH_KEY.Trim().Length -eq 0) {
            Write-Error "TAILSCALE_AUTH_KEY secret not provided. Set the secret 'TAILSCALE_AUTH_KEY'."
            exit 1
          }

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=gh-runner-$env:GITHUB_RUN_ID

          # Wait for Tailscale to assign an IPv4
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
              $tsIP = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 | Select-String -Pattern '\d+\.\d+\.\d+\.\d+' -AllMatches).Matches.Value -join ','
              if ($tsIP) { break }
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }

          # Use the first IP if multiple present
          $firstIP = $tsIP.Split(',')[0].Trim()
          echo "TAILSCALE_IP=$firstIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP assigned: $firstIP"

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Testing RDP connectivity to: $env:TAILSCALE_IP"
          if (-not $env:TAILSCALE_IP) {
            Write-Error "No Tailscale IP available to test."
            exit 1
          }
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -InformationLevel Detailed
          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to RDP port 3389 failed. Details:`n$($testResult | Out-String)"
            exit 1
          }
          Write-Host "TCP connectivity to RDP port 3389 succeeded."

      - name: Maintain Connection (prints password; secret-sourced value will likely be masked)
        shell: pwsh
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          # This will print the password into the log. If you used GitHub Secrets it will typically be masked.
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "==================`n"

          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
            Start-Sleep -Seconds 300
          }
